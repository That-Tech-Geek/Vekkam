name: Publish to PyPI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Run tests
        run: |
          python -m pip install -e ".[dev]"
          pytest -q

      - name: Generate unique release version
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text()
          match = re.search(r'^version = "([0-9]+)\\.([0-9]+)\\.([0-9]+)"$', text, re.MULTILINE)
          if not match:
              raise SystemExit("Could not find a static X.Y.Z version in pyproject.toml")

          major, minor, patch = map(int, match.groups())
          run_number = int("${{ github.run_number }}")
          version = f"{major}.{minor}.{patch + run_number}"
          path.write_text(re.sub(
              r'^version = "[^"]+"$',
              f'version = "{version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          ))
          print(f"Publishing examforge {version}")
          PY

      - name: Build package
        run: python -m build

      - name: Validate package
        run: python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: python -m twine upload --skip-existing dist/*
