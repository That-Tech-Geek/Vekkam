[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "examforge"
version = "0.2.0"
description = "CLI-first multimodal exam-preparation engine with a canonical learning IR"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
document = ["pymupdf>=1.24", "pymupdf4llm>=0.0.17", "pytesseract>=0.3.13", "opencv-python>=4.10"]
knowledge = ["neo4j>=5.25", "qdrant-client>=1.12"]
generation = ["manim>=0.18"]
audio = ["openai-whisper>=20240930"]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6", "mypy>=1.13"]

[project.scripts]
examforge = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
